name: Check
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: pnpm check
      # shortcut: tstyche fails when no dtslint/*.tst.ts exists, add `pnpm test-types` back with the first type test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: pnpm circular
      - run: pnpm lint
      - run: pnpm codegen
      - name: Check for codegen changes
        run: git diff --exit-code

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Build
        run: pnpm build
      - name: Check package entry points
        run: pnpm check-packages
      - name: Test
        run: pnpm vitest
        env:
          NODE_OPTIONS: --max_old_space_size=8192

  anvil:
    name: Anvil
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Start Anvil
        run: |
          anvil --silent &
          timeout 30 bash -c 'until cast block-number --rpc-url http://127.0.0.1:8545; do sleep 1; done'
      - name: Test
        run: pnpm vitest run packages/evm/test/EvmRelayer.anvil.test.ts
        env:
          ANVIL_RPC_URL: http://127.0.0.1:8545
