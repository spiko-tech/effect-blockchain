name: Check
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: pnpm check
      # shortcut: tstyche fails when no dtslint/*.tst.ts exists, add `pnpm test-types` back with the first type test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: pnpm circular
      - run: pnpm lint
      - run: pnpm codegen
      - name: Check for codegen changes
        run: git diff --exit-code

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Build
        run: pnpm build
      - name: Check package entry points
        run: pnpm check-packages
      - name: Test
        run: pnpm vitest
        env:
          NODE_OPTIONS: --max_old_space_size=8192

  anvil:
    name: Anvil
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.9.0
      - name: Start Anvil
        run: |
          anvil --silent &
          timeout 30 bash -c 'until cast block-number --rpc-url http://127.0.0.1:8545; do sleep 1; done'
      - name: Test
        run: pnpm vitest run packages/evm/test/EvmRelayer.anvil.test.ts
        env:
          ANVIL_RPC_URL: http://127.0.0.1:8545

  starknet-devnet:
    name: Starknet Devnet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Start starknet-devnet
        run: |
          docker run --detach --publish 5050:5050 shardlabs/starknet-devnet-rs@sha256:837a1286939a98cfadd0804a98397df4f1de5b773d3ebb94bcb9cc5fe8e8f004 --seed 0 # shardlabs/starknet-devnet-rs:0.7.1
          timeout 60 bash -c 'until curl --silent --fail http://127.0.0.1:5050/is_alive; do sleep 1; done'
      - name: Test
        run: pnpm vitest run packages/starknet/test/StarknetRelayer.devnet.test.ts
        env:
          STARKNET_DEVNET_RPC_URL: http://127.0.0.1:5050

  stellar-quickstart:
    name: Stellar quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Start quickstart
        run: |
          docker run -d -p 8000:8000 stellar/quickstart@sha256:a61ce821add98adb4f3e3d6e757b2615dd169a2b39c7e30cd47cfa95074f97d9 --local --enable rpc # stellar/quickstart:v693-b1627.1-latest
          health='{"jsonrpc":"2.0","id":1,"method":"getHealth"}'
          timeout 180 bash -c "until curl -sf -H 'content-type: application/json' -d '$health' http://127.0.0.1:8000/rpc | grep -q healthy; do sleep 2; done"
          # friendbot starts after the RPC: fund an account nobody holds the key of
          timeout 60 bash -c 'until curl -sf "http://127.0.0.1:8000/friendbot?addr=GD7777777777777777777777777777777777777777777777777773DB"; do sleep 2; done'
      - name: Test
        run: pnpm vitest run packages/stellar/test/StellarRelayer.quickstart.test.ts
        env:
          QUICKSTART_RPC_URL: http://127.0.0.1:8000/rpc

  solana-test-validator:
    name: Solana test validator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Install the Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Start solana-test-validator
        run: |
          solana-test-validator --reset --quiet --ledger "$RUNNER_TEMP/ledger" &
          timeout 60 bash -c 'until solana cluster-version --url http://127.0.0.1:8899; do sleep 1; done'
      - name: Test
        run: pnpm vitest run packages/solana/test/SolanaRelayer.validator.test.ts
        env:
          SOLANA_TEST_VALIDATOR_RPC_URL: http://127.0.0.1:8899
