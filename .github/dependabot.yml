# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm refuses versions younger than its minimumReleaseAge (1 day by default)
    cooldown:
      default-days: 1
    groups:
      npm:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci(deps)
    open-pull-requests-limit: 3
